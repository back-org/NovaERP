server:
  port: 8080

spring:
  application:
    name: novaerp
 
  # ==========================
  #   Mail
  # ==========================
  mail:
    host: smtp.example.com
    port: 587
    username: your-smtp-user
    password: your-smtp-password
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true

  # ==========================
  #   Datasource MySQL
  # ==========================
  datasource:
    # 👉 En local avec Docker Compose : host = mysql (nom du service docker-compose)
    url: jdbc:mysql://localhost:3306/novaerp
    username: root
    password: Ma$terkey1
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==========================
  #   JPA / Hibernate
  # ==========================
  jpa:
    hibernate:
      # En dev : update ; en prod : validate ou none
      ddl-auto: update
    show-sql: true
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ==========================
  #   Flyway (migrations SQL)
  # ==========================
  flyway:
    enabled: true
    # Dossier par défaut : classpath:db/migration
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ==========================
  #   Jackson (JSON)
  # ==========================
  jackson:
    default-property-inclusion: non_null # to exclude null in json serialization
    # serialization:
      # write-dates-as-timestamps: true
  data:
    redis:
      host: localhost
      port: 6379

# ==========================
#   Sécurité JWT
# ==========================
security:
  jwt:
    # ⚠️ à changer en prod par une vraie clé longue & random
    secret: "KHE6bcAIpAb4eIuLGReqKcTxSk9HKadJNkLFagnjy3B"
    expiration-ms: 3600000   # 1 heure

# ==========================
#   Swagger / Springdoc
# ==========================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# ==========================
#   Actuator
# ==========================
# --- Management / Actuator ---
management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  server:
    # Optionnel : utiliser un port séparé pour l'admin (ex : 8081).
    # Commenter ou supprimer si tu veux que Actuator soit servi sur le même port que l'app (8080)
    port: 8081

  endpoints:
    web:
      base-path: /actuator
      # Endpoints exposés via HTTP (ajoute/retire selon besoin)
      exposure:
        include: health,info,metrics,prometheus,env,loggers,threaddump,heapdump,httptrace,beans

  endpoint:
    health:
      # show-details: "always" | "when_authorized" | "never"
      show-details: when_authorized
    httptrace:
      enabled: true

  # --- Prometheus (Micrometer) ---
  metrics:
    export:
      prometheus:
        enabled: true

# Info properties (affichées par /actuator/info)
info:
  app:
    name: novaerp
    version: 1.0.0
    description: "NovaERP backend API"

# Actuator health readiness / liveness probe configuration (kubernetes style)


# ==========================
#   Logging
# ==========================
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.boot.actuate: INFO
    com.novaerp: DEBUG
  file:
    name: ./logs/novaerp.log


